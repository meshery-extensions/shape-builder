name: Build PR Preview

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout PR
        if: github.event.action != 'closed'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: make setup

      - name: Set PATH_PREFIX
        if: github.event.action != 'closed'
        run: echo "PATH_PREFIX=pr-preview/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      - name: Build PR preview
        if: github.event.action != 'closed'
        env:
          GATSBY_PREVIEW: "true"
          GATSBY_SITE_URL: https://${{ github.repository_owner }}.github.io
        run: |
          make build-preview

          # Prevent search engines from indexing temporary previews.
          cat > site/public/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF

      - name: Save PR metadata
        run: |
          mkdir -p pr
          echo "${{ github.event.pull_request.number }}" > pr/number
          echo "${{ github.event.pull_request.head.sha }}" > pr/sha
          echo "${{ github.event.action }}" > pr/action

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shape-builder-preview
          path: |
            pr/
            site/public/
          if-no-files-found: error
          retention-days: 7
